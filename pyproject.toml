[project]
name = "tshirt-automation"
version = "0.1.0"
description = "Measurement layer for the print-on-demand t-shirt automation system."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.1",
    "tabulate>=0.9",
    "streamlit>=1.40",
    "pandas>=2.0",
    "anthropic>=0.69",
]

[project.scripts]
tshirt-check = "tshirt.config:main"
tshirt-migrate = "tshirt.db.migrate:main"
tshirt-nightly = "tshirt.jobs.nightly:main"
tshirt-recommend = "tshirt.jobs.recommend:main"
tshirt-dash = "tshirt.dashboard.launch:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
